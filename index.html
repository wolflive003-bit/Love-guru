<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Guru - Royal VIP Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-box">
            <h1>🌹 Love Guru VIP</h1>
            <p>Enter the Royal Voice & Party Community</p>
        </div>

        <div class="form-group">
            <label>Your Gamer Tag</label>
            <input type="text" id="usernameInput" placeholder="Enter username..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>Choose Avatar & Frame</label>
            <div class="avatar-selector">
                <div class="avatar-option selected" onclick="selectAvatar('avatar1.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit" alt="Avatar 1">
                </div>
                <div class="avatar-option" onclick="selectAvatar('avatar2.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Garfield" alt="Avatar 2">
                </div>
                <div class="avatar-option vip-exclusive" onclick="selectAvatar('avatar3.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Destructor" alt="VIP Boss">
                    <span class="vip-tag-mini">VIP</span>
                </div>
            </div>
        </div>

        <button class="main-btn" onclick="loginUser()">Enter Royal Party 🚀</button>
    </div>

    <!-- Zaroori: Firebase module ke liye type="module" -->
    <script type="module" src="auth.js"></script>
</body>
</html>
