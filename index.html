<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Guru - VIP Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-box">
            <h1>💘 Love Guru VIP</h1>
            <p>Enter the ultimate gaming & voice community</p>
        </div>

        <div class="form-group">
            <label>Your Username</label>
            <input type="text" id="usernameInput" placeholder="Enter your gamer tag..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>Choose Your Avatar</label>
            <div class="avatar-selector">
                <div class="avatar-option selected" onclick="selectAvatar('avatar1.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="Avatar 1">
                </div>
                <div class="avatar-option" onclick="selectAvatar('avatar2.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka" alt="Avatar 2">
                </div>
                <div class="avatar-option" onclick="selectAvatar('avatar3.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Jack" alt="Avatar 3">
                </div>
                <div class="avatar-option vip-exclusive" onclick="selectAvatar('avatar4.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=VIPBoss" alt="VIP Boss">
                    <span class="vip-tag-mini">VIP</span>
                </div>
                <div class="avatar-option vip-exclusive" onclick="selectAvatar('avatar5.png', this)">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=CyberQueen" alt="Cyber Queen">
                    <span class="vip-tag-mini">VIP</span>
                </div>
            </div>
        </div>

        <button class="main-btn" onclick="loginUser()">Enter Community 🚀</button>
    </div>

    <script src="auth.js"></script>
</body>
</html>
