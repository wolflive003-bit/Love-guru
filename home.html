<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Guru - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS for 100% Free Voice Rooms without API Keys -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="app-header">
        <div class="user-profile-summary" onclick="switchTab('profile-section')">
            <img id="userAvatar" src="" alt="Avatar">
            <div>
                <h4 id="displayUsername">User</h4>
                <span id="vipBadge" class="vip-badge">VIP 0</span>
            </div>
        </div>
        <div class="wallet-box" onclick="showTopup()">
            <span>💎 <b id="diamondCount">0</b></span>
            <span>🪙 <b id="coinCount">0</b></span>
            <button class="topup-plus-btn">+</button>
        </div>
    </header>

    <!-- MAIN CONTENT SECTIONS -->
    <main class="app-content">

        <!-- 1. HOME SECTION (Matchmaking) -->
        <section id="home-section" class="app-section active-section">
            <h2>Find Your Match 💘</h2>
            <p>Select match type below:</p>

            <div class="gender-selection">
                <button class="gender-btn active">Any</button>
                <button class="gender-btn">Girl</button>
                <button class="gender-btn">Boy</button>
            </div>

            <div class="ticket-info-box">
                <p class="ticket-info">Cost: <span style="color: #00ffa2; font-weight:bold;">FREE (0 Tickets)</span></p>
                <p>Tickets Available: 🎟️ <span id="ticketCount">3</span></p>
            </div>

            <button class="main-btn" id="findMatchBtn">Start Matching 🔍</button>
        </section>

        <!-- 2. LIVE AUDIO ROOMS SECTION (PeerJS Powered) -->
        <section id="live-section" class="app-section">
            <h2>Live Audio Rooms 🎙️</h2>
            
            <div class="room-controls">
                <button class="main-btn" onclick="createVoiceRoom()">Create Room 🎧</button>
                <div class="join-box">
                    <input type="text" id="joinRoomUid" placeholder="Enter Room UID..." autocomplete="off">
                    <button class="secondary-btn" onclick="joinVoiceRoom()">Join Room</button>
                </div>
            </div>

            <div id="activeCallUI" style="display: none;" class="active-call-box">
                <h3 id="currentRoomDisplay">Room UID: -</h3>
                <p id="callStatus" style="font-weight: bold; color: yellow;">Connecting...</p>
                
                <div class="call-action-buttons">
                    <button id="micBtn" class="action-btn mic-on" onclick="toggleMic()">🎙️ Mic ON</button>
                    <button class="action-btn leave-btn" onclick="leaveVoiceRoom()">❌ Leave Room</button>
                </div>
            </div>
        </section>

        <!-- 3. CHAT SECTION -->
        <section id="chat-section" class="app-section">
            <h2>Private Chat 💬</h2>
            <div class="form-group" style="margin-top: 20px;">
                <label>Search User ID</label>
                <input type="text" id="searchUserId" placeholder="Type username...">
            </div>
            <button class="main-btn" onclick="searchUserForChat()">Open Chat</button>
        </section>

        <!-- 4. PROFILE SECTION -->
        <section id="profile-section" class="app-section">
            <div class="profile-card">
                <img id="profileAvatar" src="" alt="Profile">
                <h2 id="profileUsername">User</h2>
                <p>App ID: <span id="appIdSpan">#102938</span></p>
                <button class="logout-btn" onclick="logout()">Logout 🚪</button>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home-section')">🏠<span>Home</span></button>
        <button class="nav-item" onclick="switchTab('live-section')">🎙️<span>Live</span></button>
        <button class="nav-item" onclick="switchTab('chat-section')">💬<span>Chat</span></button>
        <button class="nav-item" onclick="switchTab('profile-section')">👤<span>Profile</span></button>
    </nav>

    <!-- TOPUP MODAL -->
    <div id="topupModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>VIP Top-up Store 💎</h3>
            <p>Select Diamond Pack:</p>
            <button class="pack-btn" onclick="processPayment(50)">50 INR = 500 Diamonds 💎</button>
            <button class="pack-btn" onclick="processPayment(100)">100 INR = 1200 Diamonds 💎</button>
            <button class="close-modal-btn" onclick="closeTopup()">Cancel</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
