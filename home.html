<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Guru - Royal Party Room</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="app-header">
        <div class="user-profile-summary" onclick="switchTab('profile-section')">
            <img id="userAvatar" src="" alt="Avatar">
            <div>
                <h4 id="displayUsername">User</h4>
                <span id="vipTagUI" class="vip-badge-tag vip-tag-v2">VIP 2</span>
            </div>
        </div>
        <div class="wallet-box">
            <span>💎 <b id="diamondCount">500</b></span>
            <span>🪙 <b id="coinCount">1200</b></span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-content">

        <!-- 1. PARTY ROOM SECTION (8-MIC SEATS) -->
        <section id="party-section" class="app-section active-section">
            <div class="party-room-container">
                <div class="room-top-info">
                    <h3>🌹 Royal Party Room</h3>
                    <span id="roomStatusBadge" style="color: #ffd700; font-size: 12px;">Tap seat to take mic</span>
                </div>

                <!-- 8 Mic Seats Grid -->
                <div class="mic-grid">
                    <div class="mic-seat" onclick="takeMic(1)">
                        <div class="mic-circle" id="seat1">🎙️</div>
                        <span class="seat-number">Host (1)</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(2)">
                        <div class="mic-circle" id="seat2">🔒</div>
                        <span class="seat-number">Seat 2</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(3)">
                        <div class="mic-circle" id="seat3">🎙️</div>
                        <span class="seat-number">Seat 3</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(4)">
                        <div class="mic-circle" id="seat4">🎙️</div>
                        <span class="seat-number">Seat 4</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(5)">
                        <div class="mic-circle" id="seat5">🎙️</div>
                        <span class="seat-number">Seat 5</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(6)">
                        <div class="mic-circle" id="seat6">🎙️</div>
                        <span class="seat-number">Seat 6</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(7)">
                        <div class="mic-circle" id="seat7">🎙️</div>
                        <span class="seat-number">Seat 7</span>
                    </div>
                    <div class="mic-seat" onclick="takeMic(8)">
                        <div class="mic-circle" id="seat8">🎙️</div>
                        <span class="seat-number">Seat 8</span>
                    </div>
                </div>

                <button class="main-btn" onclick="createOrJoinRoom()">Open / Join Audio Stream 🎧</button>
            </div>
        </section>

        <!-- 2. CHAT SECTION -->
        <section id="chat-section" class="app-section">
            <h2>Royal Inbox 💬</h2>
            <p style="color: #ff99bb; margin-top: 10px;">No new messages.</p>
        </section>

        <!-- 3. PROFILE SECTION -->
        <section id="profile-section" class="app-section">
            <div style="background: #2a080c; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #ff2a6d;">
                <img id="profileAvatar" src="" alt="Profile" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid #ffd700; margin-bottom: 10px;">
                <h2 id="profileUsername">User</h2>
                <p style="margin: 10px 0;"><span class="vip-badge-tag vip-tag-amber">Amber Tag</span> <span class="vip-badge-tag vip-tag-baron">Baron</span></p>
                <button onclick="logout()" style="margin-top: 15px; background: #ef4444; border: none; padding: 8px 15px; color:#fff; border-radius: 8px; font-weight:bold; cursor:pointer;">Logout 🚪</button>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('party-section')">🎙️<span>Party</span></button>
        <button class="nav-item" onclick="switchTab('chat-section')">💬<span>Chat</span></button>
        <button class="nav-item" onclick="switchTab('profile-section')">👤<span>Mine</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
